<head>

<title>GTA VI — Acte 6 · Compte à rebours</title>

<style>

</style>

<body>
<div id="viewport"><div id="stage">
  <canvas id="fond" class="fill" width="1920" height="1080"></canvas>
</div></div>
<script type="module">
import { $, ACTES, E, tw, prog, clamp, lerp } from '../lib/core.js';
import { dessinerFond, dessinerLigne, ligne, LIGNE } from '../lib/raccord.js';
import { plan, photo } from '../lib/footage.js';
import { creerCadre } from '../lib/cadre.js';
import { creerHabillage } from '../lib/habillage.js';
import { demarrer } from '../lib/acte.js';

const ACTE = 6;
const stage = $('stage');
const ctx = $('fond').getContext('2d');
let cadre, hab;

demarrer({
  acte: ACTE,
  async preparer() {
    cadre = creerCadre(stage, { acte: ACTE, techniques: [[0, 'Compte à rebours']] });
    hab = creerHabillage(stage, { duree: ACTES[ACTE - 1].duree, vignette: 0.6 });
  },
  async render(t) {
    dessinerFond(ctx);
    dessinerLigne(ctx, LIGNE);
    cadre.maj(t);
    hab.maj(t);
  },
});
</script>
</body>

<!doctype html><html><head><meta charset="utf-8"><style>
/* Faux chat de live (style chat Twitch sombre, sans logo) pour l'écran vertical du setup.
   #cadre : en-tête et zone de saisie fixes (le milieu est transparent) ; #fil : la liste des messages, deux fois. */
@font-face{font-family:Rubik;src:url(../da/Rubik-1.ttf)}@font-face{font-family:Rubik;font-weight:500;src:url(../da/Rubik-2.ttf)}
@font-face{font-family:Rubik;font-weight:900;src:url(../da/Rubik-3.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;font-family:Rubik,sans-serif;color:#efeff1}
#cadre{width:720px;height:1280px;position:relative}
#cadre .tete{position:absolute;left:0;right:0;top:0;height:70px;background:#18181b;border-bottom:2px solid #2f2f35;display:flex;align-items:center;justify-content:center;font:500 22px Rubik;letter-spacing:1.5px}
#cadre .tete i{position:absolute;top:22px;width:26px;height:26px;border:3px solid #adadb8;border-radius:5px}
#cadre .tete i.g{left:22px;border-left-width:9px}#cadre .tete i.d{right:22px;border-radius:50%}
#cadre .pied{position:absolute;left:0;right:0;bottom:0;height:150px;background:#18181b;padding:16px 20px}
#cadre .saisie{height:56px;border-radius:10px;background:#2f2f35;color:#adadb8;font-size:23px;display:flex;align-items:center;padding:0 18px;justify-content:space-between}
#cadre .saisie b{width:30px;height:30px;border-radius:50%;border:3px solid #adadb8}
#cadre .ligne{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:#adadb8;font-size:21px}
#cadre .ligne span::before{content:"";display:inline-block;width:20px;height:20px;border-radius:50%;border:3px solid #E0A93B;margin-right:10px;vertical-align:-3px}
#cadre .ligne button{font:500 22px Rubik;color:#fff;background:#9147ff;border:0;border-radius:8px;padding:9px 22px}
#fil{width:720px;background:#18181b;padding:0}
.m{padding:7px 20px;font-size:25px;line-height:1.45;word-wrap:break-word}
.m .n{font-weight:500}
.m .bd{display:inline-block;width:22px;height:22px;border-radius:5px;margin-right:6px;vertical-align:-3px}
.m img,.m svg.e{width:34px;height:34px;vertical-align:-9px;margin:0 2px}
.ev{margin:6px 0;padding:12px 18px 12px 16px;border-left:6px solid #9147ff;background:#1f1f23;font-size:23px;line-height:1.4;color:#efeff1}
.ev b{font-weight:500}.ev small{display:block;color:#adadb8;font-size:20px;margin-top:2px}
.ev.or{border-left-color:#E0A93B}
</style></head><body>
<div id="cadre">
  <div class="tete"><i class="g"></i>CHAT DU STREAM<i class="d"></i></div>
  <div class="pied"><div class="saisie">Envoyer un message<b></b></div><div class="ligne"><span>12,4 k</span><button>Chat</button></div></div>
</div>
<div id="fil"></div>
<script>
// Emotes maison aux couleurs de la DA (en attendant les vraies emotes du pack).
const E = {
  GG: '<svg class="e" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#E0A93B"/><text x="17" y="23" font-family="Rubik" font-weight="900" font-size="15" text-anchor="middle" fill="#1d1408">GG</text></svg>',
  Love: '<svg class="e" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#1E5B57"/><path d="M17 26 7 16a5.5 5.5 0 0 1 10-6 5.5 5.5 0 0 1 10 6z" fill="#E0A93B"/></svg>',
  Pog: '<svg class="e" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#F2C97A"/><circle cx="11" cy="13" r="3.2" fill="#1d1408"/><circle cx="23" cy="13" r="3.2" fill="#1d1408"/><ellipse cx="17" cy="24" rx="5" ry="6" fill="#1d1408"/></svg>',
  LUL: '<svg class="e" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#F2C97A"/><path d="M8 13q3-4 6 0M20 13q3-4 6 0" stroke="#1d1408" stroke-width="2.5" fill="none"/><path d="M8 19q9 12 18 0z" fill="#1d1408"/></svg>',
  Hype: '<svg class="e" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#1E5B57"/><path d="M10 22l7-7 7 7M10 15l7-7 7 7" stroke="#E0A93B" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>',
};
const C = ['#FF6B6B', '#5BA8FF', '#3FCB7A', '#FFB34D', '#C792EA', '#FF7FB5', '#4FD1C5', '#F2C97A', '#9AE65C', '#7AA7FF', '#FF8A5C', '#B8A6FF'];
const B = { s: '#E0A93B', m: '#00ad03', v: '#e005b9' };
// [badges, pseudo, message]  ou  ['ev', texte, détail, couleur]
const M = [
  ['s', 'Nyx', 'bonsoir tout le monde ' + E.Love],
  ['', 'Marlo', 'le nouveau setup est trop propre'],
  ['m', 'Sacha', 'on accueille les nouveaux, soyez sympas ' + E.Love],
  ['', 'Ilan', 'c\'est quoi la musique ?'],
  ['s', 'Jade', E.Hype + E.Hype + E.Hype],
  ['', 'Tom', 'la DeLorean sur l\'étagère mdr'],
  ['ev', '<b>Lyra</b> s\'est abonnée au niveau 1.', 'Abonnée depuis 6 mois !', ''],
  ['v', 'Kenji', 'GG pour hier soir ' + E.GG],
  ['', 'Moussa', 'premier live ici, ambiance de fou'],
  ['s', 'Nyx', 'wubba lubba dub dub'],
  ['', 'Elisa', 'le gant de l\'Infini il est réel ?? ' + E.Pog],
  ['m', 'Sacha', '!planning pour les horaires des lives'],
  ['', 'Bastien', 'tu joues à quoi ce soir ?'],
  ['s', 'Marlo', 'la vue sur la ville ' + E.Pog],
  ['', 'Rayan', E.LUL + ' le plumbus'],
  ['', 'Chloé', 'hello hello'],
  ['ev', '<b>Marlo</b> a offert 5 abonnements à la communauté !', 'Merci pour le soutien', 'or'],
  ['s', 'Jade', 'merci Marlo ' + E.Love + E.Love],
  ['', 'Hugo', 'c\'est quel micro ? on dirait un SM7B'],
  ['v', 'Kenji', 'oui SM7B sur bras'],
  ['', 'Inès', 'le chat est chaud ce soir ' + E.Hype],
  ['s', 'Tom', 'Kayzx t\'as vu le clip d\'hier ?'],
  ['', 'Léo', 'trop hâte du live'],
  ['', 'Amine', E.GG + E.GG],
  ['m', 'Sacha', 'pensez à suivre la chaîne pour être prévenus ' + E.Love],
  ['', 'Lou', 'l\'intro avec la pièce en 3D est incroyable'],
  ['s', 'Nyx', 'on veut une visite du studio !'],
  ['', 'Yanis', E.Pog + ' la télé 85 pouces'],
  ['ev', 'Raid de <b>Sacha</b> avec 38 spectateurs', 'Bienvenue aux raiders !', ''],
  ['', 'Maëlys', 'coucou les raiders ' + E.Love],
  ['s', 'Jade', 'je reste jusqu\'au bout ce soir'],
  ['', 'Noah', 'tu fais une partie avec les abonnés ?'],
  ['v', 'Kenji', E.LUL + E.LUL + E.LUL],
  ['', 'Sarah', 'le son est nickel'],
  ['s', 'Marlo', 'on est combien là ?'],
  ['', 'Enzo', 'premier !'],
  ['', 'Clara', 'trop beau le salon ' + E.Hype],
  ['s', 'Tom', 'Retour vers le futur > tout'],
  ['m', 'Sacha', 'restez cool dans le chat svp ' + E.Love],
  ['', 'Ilan', 'let\'s go ' + E.GG],
];
const lig = (m, i) => m[0] === 'ev'
  ? `<div class="ev ${m[3]}">${m[1]}<small>${m[2]}</small></div>`
  : `<div class="m">${m[0] ? `<span class="bd" style="background:${B[m[0]]}"></span>` : ''}<span class="n" style="color:${C[(m[1].length * 7 + m[1].charCodeAt(0)) % C.length]}">${m[1]}</span> : ${m[2]}</div>`;
const html = M.map(lig).join('');
document.getElementById('fil').innerHTML = `<div id="c1">${html}</div><div id="c2">${html}</div>`;
window.MESURES = () => {
  const c1 = document.getElementById('c1'), base = c1.getBoundingClientRect().top;
  return { hauteur: c1.getBoundingClientRect().height,
           messages: [...c1.children].map((e) => { const r = e.getBoundingClientRect(); return [r.top - base, r.height]; }) };
};
</script></body></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Séquence navigateur</title><style>
/* La séquence « comment me trouver » : YouTube → recherche Google → Twitch → le live démarre.
   Les trois interfaces sont recréées dans la DA du pack (papier, teal, miel, Rubik) : chacune garde ce qui la rend
   reconnaissable (son logo et sa couleur de marque, la forme de sa barre de recherche), le reste suit la charte.
   Fond transparent : attente.py pose cette fenêtre sur le motif d'encre.
   Pilotée image par image : window.__render(t), t en secondes depuis le début de la séquence (0 → 25). */
@font-face{font-family:Rubik;src:url(../da/Rubik-1.ttf)}@font-face{font-family:Rubik;font-weight:500;src:url(../da/Rubik-2.ttf)}
@font-face{font-family:Rubik;font-weight:900;src:url(../da/Rubik-3.ttf)}
:root{--nuit:#0F1519;--teal:#1E5B57;--teal-n:#3FD3C2;--miel:#E0A93B;--papier:#F1ECE3;--ligne:#E2DACB;--gris:#6B7A7B;
  --yt:#FF0000;--tw:#9146FF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:transparent;font-family:Rubik,sans-serif;overflow:hidden}
#scene{position:relative;width:1920px;height:1080px}

/* ---- La fenêtre : cadre papier épais, contour nuit, ombre portée nette (comme les cartes du pack) ---- */
#fen{position:absolute;left:210px;top:150px;width:1500px;height:800px;background:var(--papier);
  border:6px solid var(--nuit);border-radius:26px;box-shadow:0 18px 0 rgba(15,21,25,.9),0 40px 90px rgba(5,8,10,.55);
  overflow:hidden;transform-origin:50% 50%}
#barre{height:72px;background:var(--papier);border-bottom:4px solid var(--nuit);display:flex;align-items:center;gap:16px;padding:0 22px}
.pastilles{display:flex;gap:9px}.pastilles i{width:16px;height:16px;border-radius:50%;border:3px solid var(--nuit)}
.pastilles i:nth-child(1){background:#E8836F}.pastilles i:nth-child(2){background:var(--miel)}.pastilles i:nth-child(3){background:var(--teal-n)}
#url{flex:1;height:44px;background:#fff;border:3px solid var(--nuit);border-radius:999px;display:flex;align-items:center;
  gap:12px;padding:0 20px;font:500 22px Rubik;color:var(--nuit)}
#url .cadenas{width:16px;height:16px;border:3px solid var(--teal);border-radius:3px;border-bottom-width:9px;flex:none}
#url span{white-space:nowrap;overflow:hidden}
#page{position:relative;height:724px;overflow:hidden}
.vue{position:absolute;inset:0;opacity:0}

/* ---- YouTube ---- */
#v-yt{background:#fff}
.yt-haut{height:76px;border-bottom:3px solid var(--ligne);display:flex;align-items:center;gap:18px;padding:0 28px}
.yt-logo{display:flex;align-items:center;gap:9px;font:900 30px Rubik;color:var(--nuit);letter-spacing:-1px}
.yt-logo i{width:46px;height:33px;background:var(--yt);border-radius:9px;display:grid;place-items:center}
.yt-logo i:after{content:"";border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.yt-rech{width:420px;height:42px;border:3px solid var(--nuit);border-radius:999px;margin-left:26px}
#yt-banniere{height:246px;background:url(banniere.png) center/cover;border-bottom:3px solid var(--ligne)}
.yt-ident{display:flex;align-items:center;gap:26px;padding:24px 44px 0}
#yt-ava{width:152px;height:152px;border-radius:50%;border:5px solid var(--nuit);background:url(logo-rond.png) center/cover;flex:none;margin-top:-58px}
.yt-nom{font:900 46px Rubik;color:var(--nuit);letter-spacing:-1px}
.yt-sous{font:500 23px Rubik;color:var(--gris);margin-top:6px;display:flex;gap:16px;align-items:center}
.yt-sous b{color:var(--nuit);font-weight:900}
#yt-plus{position:relative;display:inline-block;color:var(--teal);font-weight:900;opacity:0}
#yt-bout{margin-left:auto;height:62px;padding:0 38px;border:4px solid var(--nuit);border-radius:999px;background:var(--yt);
  color:#fff;font:900 26px/54px Rubik;letter-spacing:1px;box-shadow:0 6px 0 var(--nuit);white-space:nowrap}
#yt-bout.fait{background:var(--ligne);color:var(--nuit);display:flex;align-items:center;gap:12px;padding:0 30px}
#yt-cloche{width:26px;height:26px;display:none}
#yt-bout.fait #yt-cloche{display:block}
.yt-videos{display:flex;gap:22px;padding:26px 44px 0}
.yt-videos div{flex:1}
.yt-videos i{display:block;height:104px;border-radius:14px;border:3px solid var(--nuit);background:linear-gradient(135deg,#1E5B57,#0F1519)}
.yt-videos b{display:block;height:13px;border-radius:99px;background:var(--ligne);margin-top:12px}
.yt-videos b+b{width:62%;margin-top:9px}

/* ---- Google ---- */
#v-go{background:#fff;display:flex;flex-direction:column;align-items:center;padding-top:132px}
.go-logo{font:900 92px Rubik;letter-spacing:-4px;display:flex}
.go-logo span:nth-child(1){color:#4285F4}.go-logo span:nth-child(2){color:#EA4335}.go-logo span:nth-child(3){color:#FBBC05}
.go-logo span:nth-child(4){color:#4285F4}.go-logo span:nth-child(5){color:#34A853}.go-logo span:nth-child(6){color:#EA4335}
#go-rech{margin-top:46px;width:760px;height:72px;border:4px solid var(--nuit);border-radius:999px;display:flex;align-items:center;
  gap:18px;padding:0 30px;box-shadow:0 6px 0 var(--nuit);font:500 30px Rubik;color:var(--nuit);background:#fff}
.loupe{width:26px;height:26px;border:4px solid var(--gris);border-radius:50%;position:relative;flex:none}
.loupe:after{content:"";position:absolute;right:-9px;bottom:-7px;width:12px;height:4px;background:var(--gris);transform:rotate(45deg);border-radius:2px}
#go-curseur{display:inline-block;width:3px;height:34px;background:var(--nuit);vertical-align:-6px;margin-left:2px}
#go-sugg{width:760px;margin-top:14px;background:#fff;border:4px solid var(--nuit);border-radius:22px;box-shadow:0 6px 0 var(--nuit);
  overflow:hidden;opacity:0}
#go-sugg div{display:flex;align-items:center;gap:16px;padding:14px 28px;font:500 26px Rubik;color:var(--nuit)}
#go-sugg div+div{border-top:3px solid var(--ligne)}
#go-sugg div.vise{background:var(--ligne)}
#go-sugg b{color:var(--teal);font-weight:900}

/* ---- Twitch ---- */
#v-tw{background:#F7F7F8}
.tw-haut{height:76px;border-bottom:3px solid #D9D9DE;display:flex;align-items:center;gap:20px;padding:0 28px}
.tw-logo{display:flex;align-items:center;gap:10px;font:900 30px Rubik;color:var(--nuit);letter-spacing:-1px}
.tw-logo i{width:30px;height:34px;background:var(--tw);
  clip-path:polygon(8% 0,100% 0,100% 68%,66% 100%,46% 100%,28% 100%,28% 82%,8% 82%);flex:none;position:relative}
.tw-corps{display:flex;gap:24px;padding:26px 30px 0}
.tw-lecteur{flex:1;height:390px;border:4px solid var(--nuit);border-radius:18px;overflow:hidden;position:relative;background:#000}
#tw-ecran{position:absolute;inset:0;background:url(ecran-hl.png) center/cover}
#tw-direct{position:absolute;inset:0;background:url(ecran-live.png) center/cover;opacity:0}
#tw-live{position:absolute;left:18px;top:18px;background:#E8183F;color:#fff;font:900 20px Rubik;letter-spacing:2px;
  padding:7px 16px;border-radius:8px;border:3px solid var(--nuit);opacity:0}
#tw-spectateurs{position:absolute;left:18px;top:18px;margin-left:116px;background:rgba(15,21,25,.85);color:var(--papier);
  font:900 20px Rubik;padding:7px 16px;border-radius:8px;border:3px solid var(--nuit);opacity:0;display:flex;gap:9px;align-items:center}
#tw-spectateurs i{width:9px;height:9px;border-radius:50%;background:#E8183F}
.tw-chat{width:330px;height:390px;background:#fff;border:4px solid var(--nuit);border-radius:18px;padding:16px 18px;
  display:flex;flex-direction:column;gap:11px;overflow:hidden}
.tw-chat .t{font:900 17px Rubik;letter-spacing:3px;color:var(--teal);border-bottom:3px solid var(--ligne);padding-bottom:11px}
.tw-chat p{font:500 20px Rubik;color:var(--nuit);opacity:0}
.tw-chat p b{font-weight:900}
.tw-ident{display:flex;align-items:center;gap:22px;padding:24px 34px 0}
#tw-ava{width:104px;height:104px;border-radius:50%;border:5px solid var(--nuit);background:url(logo-rond.png) center/cover;flex:none;position:relative}
#tw-ava:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:5px solid #E8183F;opacity:0}
#tw-ava.direct:after{opacity:1}
.tw-nom{font:900 40px Rubik;color:var(--nuit);letter-spacing:-1px}
.tw-cat{font:500 23px Rubik;color:var(--tw);font-weight:900;margin-top:5px}
#tw-bout{margin-left:auto;height:58px;padding:0 34px;border:4px solid var(--nuit);border-radius:999px;background:var(--tw);
  color:#fff;font:900 24px/50px Rubik;letter-spacing:1px;box-shadow:0 6px 0 var(--nuit)}

/* ---- Le curseur ---- */
#cur{position:absolute;width:46px;height:56px;opacity:0;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(5,8,10,.5))}
#onde{position:absolute;width:30px;height:30px;border:5px solid var(--miel);border-radius:50%;opacity:0;pointer-events:none}
/* ---- Les légendes du bas ---- */
#legende{position:absolute;left:0;right:0;top:982px;display:flex;justify-content:center}
#legende div{display:flex;align-items:center;gap:18px;background:var(--papier);border:4px solid var(--nuit);border-radius:999px;
  padding:14px 38px;box-shadow:0 7px 0 var(--nuit);font:900 34px Rubik;color:var(--nuit);white-space:nowrap;opacity:0}
#legende em{font-style:normal;color:var(--teal)}
#legende b{color:var(--miel);-webkit-text-stroke:1.5px var(--nuit)}
</style></head><body>
<div id="scene">
  <div id="fen">
    <div id="barre"><div class="pastilles"><i></i><i></i><i></i></div><div id="url"><i class="cadenas"></i><span id="url-t"></span></div></div>
    <div id="page">
      <!-- YouTube -->
      <div class="vue" id="v-yt">
        <div class="yt-haut"><div class="yt-logo"><i></i>YouTube</div><div class="yt-rech"></div></div>
        <div id="yt-banniere"></div>
        <div class="yt-ident"><div id="yt-ava"></div>
          <div><div class="yt-nom">Kayzx TV</div>
            <div class="yt-sous">@kayzxtv8505 <span id="yt-plus">+ 1 abonné</span></div></div>
          <div id="yt-bout"><svg id="yt-cloche" viewBox="0 0 24 24" fill="none" stroke="#0F1519" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10.5 20a2 2 0 0 0 3 0"/></svg><span id="yt-txt">S'ABONNER</span></div>
        </div>
        <div class="yt-videos"><div><i></i><b></b><b></b></div><div><i></i><b></b><b></b></div><div><i></i><b></b><b></b></div><div><i></i><b></b><b></b></div></div>
      </div>
      <!-- Google -->
      <div class="vue" id="v-go">
        <div class="go-logo"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div>
        <div id="go-rech"><i class="loupe"></i><span id="go-t"></span><i id="go-curseur"></i></div>
        <div id="go-sugg">
          <div class="vise"><i class="loupe"></i><b>twitch</b></div>
          <div><i class="loupe"></i>twitch <b>kayzx tv</b></div>
          <div><i class="loupe"></i>twitch téléchargement</div>
        </div>
      </div>
      <!-- Twitch -->
      <div class="vue" id="v-tw">
        <div class="tw-haut"><div class="tw-logo"><i></i>Twitch</div></div>
        <div class="tw-corps">
          <div class="tw-lecteur"><div id="tw-ecran"></div><div id="tw-direct"></div>
            <div id="tw-live">● EN DIRECT</div><div id="tw-spectateurs"><i></i><span id="tw-nb">0</span></div></div>
          <div class="tw-chat"><div class="t">CHAT</div>
            <p><b style="color:#1E5B57">Nyx</b> : enfin !</p>
            <p><b style="color:#A06A12">kiwi_frais</b> : bonsoir</p>
            <p><b style="color:#B9533F">Tom_37</b> : on est là</p>
            <p><b style="color:#3E6A8A">Saphira</b> : hype</p>
          </div>
        </div>
        <div class="tw-ident"><div id="tw-ava"></div>
          <div><div class="tw-nom">Kayzx TV</div><div class="tw-cat">Just Chatting</div></div>
          <div id="tw-bout">SUIVRE</div>
        </div>
      </div>
    </div>
  </div>
  <svg id="cur" viewBox="0 0 36 44"><path d="M3 2 L3 33 L11 25.5 L16.5 38.5 L22 36 L16.6 23.4 L27.5 23.4 Z" fill="#F1ECE3" stroke="#0F1519" stroke-width="3" stroke-linejoin="round"/></svg>
  <div id="onde"></div>
  <div id="legende">
    <div id="l1">Abonne-toi sur <em>YouTube</em></div>
    <div id="l2">Puis cherche <b>twitch</b></div>
    <div id="l3">Et le live est <em>là</em></div>
  </div>
</div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const p = (t, t0, d) => clamp((t - t0) / d);
const lisse = (k) => k * k * (3 - 2 * k);
const sortie = (k) => 1 - Math.pow(1 - k, 3);
const retour = (k) => { const c = 1.70158 + 1; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const entre = (t, a, b) => t >= a && t < b;

// Les trois temps de la séquence (s) : YouTube, Google, Twitch.
const YT = 0, GO = 9.5, TW = 15.5, FIN = 25;
const URLS = [[YT, 'youtube.com/@kayzxtv8505'], [GO, 'google.com'], [TW, 'twitch.tv/kayzxx_tv']];
const RECHERCHE = 'twitch';

function curseur(x, y, opac) {
  const c = $('cur');
  c.style.transform = `translate(${x}px, ${y}px)`;
  c.style.opacity = opac;
}

function clic(t, t0, x, y) {   // l'onde qui part du point cliqué
  const k = p(t, t0, 0.55);
  const o = $('onde');
  if (k <= 0 || k >= 1) { o.style.opacity = 0; return; }
  const s = 1 + 2.6 * sortie(k);
  o.style.opacity = (1 - k) * 0.9;
  o.style.transform = `translate(${x - 15}px, ${y - 15}px) scale(${s})`;
}

function vue(id, on) { $(id).style.opacity = on ? 1 : 0; }

function render(t) {
  // --- La fenêtre : elle arrive, respire, et repart à la fin
  const arrive = retour(p(t, 0.15, 0.85));
  const part = p(t, FIN - 0.9, 0.9);
  const s = (0.86 + 0.14 * arrive) * (1 - 0.06 * lisse(part));
  $('fen').style.transform = `scale(${s}) translateY(${(1 - arrive) * 50 - lisse(part) * 30}px)`;
  $('fen').style.opacity = clamp(p(t, 0.1, 0.5) - part);

  // --- L'adresse suit la page affichée
  let url = URLS[0][1];
  for (const [t0, u] of URLS) if (t >= t0) url = u;
  $('url-t').textContent = url;

  // --- Les trois vues
  vue('v-yt', entre(t, YT, GO)); vue('v-go', entre(t, GO, TW)); vue('v-tw', t >= TW);

  // --- YouTube : le curseur arrive sur le bouton, clique, le bouton bascule
  const BX = 1430, BY = 585;          // le bouton « S'ABONNER » dans la scène
  const abonne = t >= 4.6;
  $('yt-bout').className = abonne ? 'fait' : '';
  $('yt-txt').textContent = abonne ? 'ABONNÉ' : "S'ABONNER";
  $('yt-plus').style.opacity = p(t, 4.7, 0.3) * (1 - p(t, 8.2, 0.6));
  $('yt-plus').style.transform = `translateY(${(1 - sortie(p(t, 4.7, 0.5))) * 18}px)`;
  if (abonne) {                        // la cloche sonne juste après le clic
    const k = p(t, 4.65, 0.75);
    $('yt-cloche').style.transform = `rotate(${Math.sin(k * 28) * (1 - k) * 22}deg)`;
  }
  if (entre(t, YT, GO)) {
    const k = sortie(p(t, 1.9, 1.9));
    const enfonce = entre(t, 4.5, 4.7) ? 4 : 0;
    curseur(1130 + (BX - 1130) * k, 880 + (BY - 880) * k, p(t, 1.7, 0.4));
    $('yt-bout').style.transform = `translateY(${enfonce}px)`;
    $('yt-bout').style.boxShadow = enfonce ? '0 2px 0 var(--nuit)' : '0 6px 0 var(--nuit)';
    clic(t, 4.5, BX + 10, BY + 14);
  }

  // --- Google : « twitch » s'écrit lettre par lettre, les suggestions tombent, on valide
  if (entre(t, GO, TW)) {
    const n = Math.floor(clamp(p(t, GO + 0.7, 1.5)) * RECHERCHE.length + 0.0001);
    $('go-t').textContent = RECHERCHE.slice(0, n);
    $('go-curseur').style.opacity = t < GO + 3.6 && Math.floor(t * 2.2) % 2 ? 0.15 : 1;
    $('go-sugg').style.opacity = p(t, GO + 1.9, 0.35);
    $('go-sugg').style.transform = `translateY(${(1 - sortie(p(t, GO + 1.9, 0.5))) * -16}px)`;
    const k = sortie(p(t, GO + 2.4, 1.1));
    curseur(1250 - 520 * k, 500 + 190 * k, 1);
    clic(t, GO + 3.6, 745, 700);
  }

  // --- Twitch : l'écran hors ligne passe en direct, le chat se remplit, les spectateurs montent
  if (t >= TW) {
    const direct = t >= TW + 2.6;
    $('tw-live').style.opacity = p(t, TW + 2.6, 0.3);
    $('tw-spectateurs').style.opacity = p(t, TW + 3.0, 0.4);
    $('tw-ava').className = direct ? 'direct' : '';
    $('tw-nb').textContent = Math.round(sortie(p(t, TW + 3.0, 4.0)) * 142);
    $('tw-ecran').style.filter = 'brightness(.55) saturate(.6)';
    $('tw-direct').style.opacity = p(t, TW + 2.6, 0.45);   // l'écran hors ligne laisse place au live
    $('tw-direct').style.filter = `brightness(${1 + 0.3 * (1 - p(t, TW + 2.6, 0.6))})`;
    document.querySelectorAll('.tw-chat p').forEach((el, i) => {
      const k = p(t, TW + 3.2 + i * 0.55, 0.35);
      el.style.opacity = k; el.style.transform = `translateY(${(1 - sortie(k)) * 12}px)`;
    });
    const k = sortie(p(t, TW + 0.5, 1.3));
    curseur(730 + 230 * k, 310 - 60 * k, 1 - p(t, TW + 4.2, 0.5));
    clic(t, TW + 1.9, 980, 300);
    $('tw-bout').style.transform = `translateY(${entre(t, TW + 5.2, TW + 5.4) ? 4 : 0}px)`;
  }

  // --- Les légendes, une par étape
  for (const [id, a, b] of [['l1', 2.3, GO - 0.4], ['l2', GO + 1.2, TW - 0.4], ['l3', TW + 2.8, FIN - 0.6]]) {
    const k = p(t, a, 0.45) * (1 - p(t, b, 0.45));
    const el = $(id);
    el.style.opacity = k;
    el.style.transform = `translateY(${(1 - sortie(p(t, a, 0.6))) * 26 + p(t, b, 0.45) * 26}px)`;
  }
}

window.__render = render;
document.fonts.ready.then(() => { render(0); window.__ready = true; });
</script></body></html>

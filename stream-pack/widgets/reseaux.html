<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Réseaux</title><style>
/* Le widget réseaux : il reste caché, arrive de temps en temps, déroule les quatre réseaux à tour de rôle,
   puis tous les ronds repartent ensemble. Source navigateur dans OBS, 700 x 120, fond transparent.
   Options dans l'adresse :
     ?cycle=180     secondes entre deux passages (180 par défaut, soit toutes les 3 minutes)
     ?ouvert=3.5    secondes pendant lesquelles un réseau reste déroulé
     ?taille=0.8    réduit (ou agrandit) tout le widget
     ?droite=1      le widget s'aligne à droite (pour un coin droit de l'écran)
     ?toujours=1    le widget ne repart jamais (l'ancien comportement, pour tester)
*/
@font-face{font-family:Rubik;src:url(polices/Rubik-1.ttf)}@font-face{font-family:Rubik;font-weight:500;src:url(polices/Rubik-2.ttf)}
@font-face{font-family:Rubik;font-weight:900;src:url(polices/Rubik-3.ttf)}
:root{--nuit:#0F1519;--teal:#1E5B57;--miel:#E0A93B;--papier:#F1ECE3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden}
#r{position:absolute;left:14px;top:14px;transform-origin:0 0;display:flex;gap:12px;font-family:Rubik,sans-serif}
#r.droite{left:auto;right:14px;transform-origin:100% 0;flex-direction:row-reverse}
.n{display:flex;align-items:center;background:var(--papier);border:5px solid var(--nuit);border-radius:999px;
  box-shadow:0 6px 0 var(--nuit),0 12px 26px rgba(5,8,10,.4);height:72px;padding:0 9px;overflow:hidden;
  transition:padding .5s cubic-bezier(.2,1,.3,1)}
.n .rond{width:46px;height:46px;flex:none;display:grid;place-items:center}
.n img{width:34px;height:34px;display:block}
.n img.blanc{filter:brightness(0)}   /* TikTok et X sont fournis en noir : parfait sur le papier */
.n .txt{max-width:0;opacity:0;white-space:nowrap;font:900 27px Rubik;color:var(--nuit);letter-spacing:-.3px;
  transition:max-width .55s cubic-bezier(.2,1,.3,1),opacity .3s,margin .55s cubic-bezier(.2,1,.3,1);margin-left:0}
.n .txt em{font-style:normal;color:var(--teal)}
.n.on{padding:0 24px 0 9px}
.n.on .txt{max-width:420px;opacity:1;margin-left:12px;transition-delay:.06s,.14s,0s}
#r.droite .n{flex-direction:row-reverse}
#r.droite .n.on{padding:0 9px 0 24px}
#r.droite .n.on .txt{margin-left:0;margin-right:12px}
/* Arrivée et départ : chaque rond entre en tournant par le bas, l'un après l'autre. */
.n{transform:translateY(130px) rotate(-25deg) scale(.7);opacity:0;
  transition:padding .5s cubic-bezier(.2,1,.3,1),transform .62s cubic-bezier(.2,1.5,.35,1),opacity .4s}
.n.la{transform:none;opacity:1}
#r.sort .n{transform:translateY(-130px) rotate(22deg) scale(.7);opacity:0;
  transition:transform .5s cubic-bezier(.6,-.3,.7,.5),opacity .36s ease-in}
</style></head><body>
<div id="r"></div>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const RESEAUX = [
  { logo: 'youtube.svg', txt: 'YouTube <em>Kayzx TV</em>' },
  { logo: 'tiktok.svg', blanc: true, txt: 'TikTok <em>Kayzx TV</em>' },
  { logo: 'x.svg', blanc: true, txt: '<em>@Kayzx_TV</em>' },
  { logo: 'discord.svg', txt: 'Discord · <em>!discord</em>' },
];
const nb = (c, d) => (parseFloat(Q.get(c)) > 0 ? parseFloat(Q.get(c)) : d) * 1000;
const CYCLE = nb('cycle', 180), OUVERT = nb('ouvert', 3.5), PAUSE = nb('pause', 0.9);
const TOUJOURS = Q.get('toujours') === '1';
const ECART = 110;   // décalage entre deux ronds à l'arrivée et au départ

const r = document.getElementById('r');
if (Q.get('droite') === '1') r.classList.add('droite');
const t = parseFloat(Q.get('taille'));
if (t > 0) r.style.transform = `scale(${t})`;

r.innerHTML = RESEAUX.map((x) =>
  `<div class="n"><div class="rond"><img class="${x.blanc ? 'blanc' : ''}" src="logos/${x.logo}" alt=""></div>
   <div class="txt">${x.txt}</div></div>`).join('');
const cartes = [...r.children];
const dodo = (ms) => new Promise((f) => setTimeout(f, ms));

/** Les ronds arrivent l'un après l'autre, en tournant par le bas. */
async function arriver() {
  r.classList.remove('sort');
  cartes.forEach((c, i) => setTimeout(() => c.classList.add('la'), i * ECART));
  await dodo(cartes.length * ECART + 650);
}

/** Puis ils repartent tous par le haut, dans l'autre sens. */
async function partir() {
  r.classList.add('sort');
  await dodo(620);
  cartes.forEach((c) => c.classList.remove('la'));
  r.classList.remove('sort');
}

async function passage() {
  await arriver();
  for (const c of cartes) {                 // chacun se déroule à son tour
    c.classList.add('on');
    await dodo(OUVERT);
    c.classList.remove('on');
    await dodo(PAUSE);
  }
  if (!TOUJOURS) await partir();
}

async function boucle() {
  await dodo(1200);
  for (;;) {
    const debut = Date.now();
    await passage();
    if (TOUJOURS) continue;
    await dodo(Math.max(4000, CYCLE - (Date.now() - debut)));   // le cycle compte depuis le début du passage
  }
}
boucle();
</script></body></html>

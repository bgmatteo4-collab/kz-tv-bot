<!doctype html><html><head><meta charset="utf-8"><style>
/* Les cartes d'info de l'outro, capturées en PNG transparents puis animées par outro.py.
   Même style que le reste du pack : pastille papier, contour nuit, ombre portée nette. */
@font-face{font-family:Rubik;src:url(../da/Rubik-1.ttf)}@font-face{font-family:Rubik;font-weight:500;src:url(../da/Rubik-2.ttf)}
@font-face{font-family:Rubik;font-weight:900;src:url(../da/Rubik-3.ttf)}
:root{--nuit:#0F1519;--teal:#1E5B57;--miel:#E0A93B;--papier:#F1ECE3}
*{box-sizing:border-box;margin:0;padding:0}body{background:transparent;font-family:Rubik,sans-serif}
.c{width:1300px;height:150px;display:flex;align-items:center;justify-content:center}
.p{display:flex;align-items:center;gap:20px;background:var(--papier);border:4px solid var(--nuit);border-radius:999px;
  padding:16px 42px 16px 22px;box-shadow:0 7px 0 var(--nuit);font:900 36px Rubik;color:var(--nuit);white-space:nowrap}
.p img{width:48px;height:48px;flex:none}
.p em{font-style:normal;color:var(--teal)}
.p b{font-weight:900;color:var(--miel);-webkit-text-stroke:1.5px var(--nuit)}
.rond{width:52px;height:52px;border-radius:50%;background:var(--teal);display:grid;place-items:center;flex:none}
.rond svg{width:30px;height:30px}
.rond.miel{background:var(--miel)}.rond.miel svg{stroke:var(--nuit)}
</style></head><body>
<div class="c" id="i1"><div class="p"><div class="rond miel"><svg viewBox="0 0 24 24" fill="none" stroke="#F1ECE3" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg></div>Prochain live <em>lundi 21h00</em></div></div>
<div class="c" id="i2"><div class="p"><img src="../overlays/logos/youtube.svg" alt="">La rediff sur <em>YouTube</em></div></div>
<div class="c" id="i3"><div class="p"><img src="../overlays/logos/tiktok.svg" alt="">TikTok <em>Kayzx TV</em></div></div>
<div class="c" id="i4"><div class="p"><img src="../overlays/logos/x.svg" alt=""><em>@Kayzx_TV</em></div></div>
<div class="c" id="i5"><div class="p"><img src="../overlays/logos/discord.svg" alt="">On continue sur le <b>Discord</b></div></div>
<div class="c" id="i6"><div class="p"><div class="rond"><svg viewBox="0 0 24 24" fill="#F1ECE3" stroke="none"><path d="M12 20.5 3.8 12.3a5 5 0 0 1 7.1-7.1l1.1 1.1 1.1-1.1a5 5 0 0 1 7.1 7.1z"/></svg></div>Merci à vous <em>tous</em></div></div>
</body></html>
